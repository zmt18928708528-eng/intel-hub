<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intel Hub · Gold / GPU / Mac mini</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

    <header>

        <button data-only="gold">黄金</button>
        <button data-only="gpu">显卡</button>
        <button data-only="macmini">Mac mini</button>
        <span id="stamp"></span>
      </div>
    </header>
    <main>
      <section>
        <h2>黄金</h2>
        <div id="gold" class="grid"></div>
      </section>
      <section>
        <h2>显卡</h2>
        <div id="gpu" class="grid"></div>
      </section>
      <section>
        <h2>Mac mini</h2>
        <div id="macmini" class="grid"></div>
      </section>
      <section>
        <h2>告警 / 缺口</h2>
        <ul id="warnings"></ul>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
