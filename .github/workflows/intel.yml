name: intel snapshot

on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: mkdir -p data
      - run: node --experimental-strip-types src/cli.ts all --json > data/latest.json
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh intel snapshot"
          file_pattern: data/latest.json
